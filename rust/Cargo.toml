[package]
name = "deezer-downloader"
version = "0.1.0"
edition = "2021"
description = "Local web app for downloading Deezer tracks, albums and playlists"

[dependencies]
anyhow = "1"
axum = "0.8"
blowfish = "0.9"
cbc = "0.1"
futures-util = "0.3"
hex = "0.4"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "cookies",
    "gzip",
    "brotli",
    "stream",
    "rustls-tls",
] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
webbrowser = "1"
zip = "2"

[profile.release]
strip = true
lto = "thin"
